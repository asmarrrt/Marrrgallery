<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja | MarrrGallery</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body{
            font-family:'Inter',sans-serif;
        }
    </style>
</head>

<body class="bg-slate-950 text-white">

<!-- ================= NAVBAR ================= -->

<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">

<div class="max-w-7xl mx-auto px-5">

<div class="flex justify-between items-center h-16">

<a href="index.html" class="flex items-center gap-3">

<img src="logo-asmar.png" class="h-10">

<span class="text-xl font-bold">
MarrrGallery
</span>

</a>

<a href="index.html"
class="text-red-500 hover:text-red-400">

<i class="fa-solid fa-arrow-left"></i>

<span class="ml-2">
Kembali
</span>

</a>

</div>

</div>

</header>

<!-- ================= JUDUL ================= -->

<section class="max-w-7xl mx-auto px-5 py-10">

<h1 class="text-4xl font-bold">

Keranjang Belanja

</h1>

<p class="text-slate-400 mt-2">

Periksa kembali produk sebelum melakukan checkout.

</p>

</section>

<!-- ================= LIST PRODUK ================= -->

<section class="max-w-7xl mx-auto px-5">

<div id="cartItems"

class="space-y-6">

<!-- Produk akan muncul dari JavaScript -->

</div>

</section>

<!-- ================= TOTAL ================= -->

<section class="max-w-7xl mx-auto px-5 py-12">

<div class="bg-slate-900 rounded-xl p-8 border border-slate-800">

<div class="flex justify-between mb-4">

<span>Subtotal</span>

<span id="subtotal">
Rp0
</span>

</div>

<div class="flex justify-between mb-4">

<span>Ongkir</span>

<span>
Gratis
</span>

</div>

<hr class="border-slate-700 my-5">

<div class="flex justify-between text-2xl font-bold">

<span>Total</span>

<span id="total">

Rp0

</span>

</div>

<button id="checkoutBtn"

class="w-full mt-8 bg-red-600 hover:bg-red-700 py-4 rounded-lg text-lg font-semibold transition">

<i class="fab fa-whatsapp mr-2"></i>

Checkout via WhatsApp

</button>

</div>

</section>

<!-- ================= FOOTER ================= -->

<footer class="border-t border-slate-800 mt-16 py-8 text-center text-slate-500">

© 2026 MarrrGallery

</footer>

<script src="script.js"></script>

</body>
</html>
